/* ═══ MOBILE REFINEMENTS ═══════════════════════════════════════════════
   Mirrors the pass on index.html so the two boards feel identical on a
   phone, plus rules for this page's own components (parlay cards, leg
   tables). Kept as one block so desktop styling is untouched. */
@media(max-width:768px){
  /* iOS zooms the viewport when a focused input is under 16px. */
  .sinp,.unit-inp{font-size:16px}
  .sinp{width:100%}
  .hdr-in{padding:10px 14px;gap:8px}
  .logo-mark{width:40px;height:40px}
  .logo-text{font-size:.88rem}
  /* Header controls ran past a 390px viewport and scrolled the whole page
     sideways. Wrap them onto their own row and scroll that row instead.
     Unlike index.html the W-L/ROI chips stay visible here — the record is
     the point of this board, and the scrolling row gives them room. */
  .hdr-in{flex-wrap:wrap;row-gap:6px}
  .hdr-r{width:100%;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;padding-bottom:2px}
  .hdr-r::-webkit-scrollbar{display:none}
  .hdr-r>*{flex:0 0 auto}
  .nav-in{padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .sp,.nt{white-space:nowrap;flex:0 0 auto}
  .body::before{width:240px;height:240px;opacity:.10}
  /* Roomier tap targets. */
  .fb{padding:9px 12px;font-size:12px}
  .btn{padding:9px 13px;font-size:12px}
  .theme-btn{width:38px;height:38px}
  /* Parlay card header: the game list can't sit inline at this width. */
  .pc-games{margin-left:0;width:100%;text-align:left}
  .pc-h{padding:10px 12px;gap:8px}
}
@media(max-width:500px){
  .lb td,.tw td{padding:9px 8px}
  .lb th,.tw th{padding:6px 8px;font-size:8.5px;letter-spacing:.08em}
  .detail-row td{padding:7px 8px!important}
  .pn{font-size:12px}
  .pg{font-size:9px}
  .pp{font-size:10.5px;padding:3px 6px}
  .lb-h{padding:10px 12px}
  .lb-t{font-size:13px}
  .st{padding:12px 13px}
  .st-v{font-size:1.3rem}
  .fbar{row-gap:6px}
  .fl{width:100%}
  /* Same overflow trap index.html hit: .bar-c uses flex:1, and flex items
     won't shrink below their content, so 14 bars demand ~500px inside a
     ~325px card and escape it, scrolling the whole document sideways.
     Fixed basis + scroll within the chart. */
  .bar-chart{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:4px;height:96px}
  .bar-chart::-webkit-scrollbar{display:none}
  .bar-c{flex:0 0 38px;min-width:0}
  .bar-v{font-size:8px}
  .bar-l{font-size:8px}
  /* Belt-and-braces: nothing inside a card widens the page. */
  .card,.ch,.pc{overflow-x:hidden}
  /* Leg rows: drop to player + prop + price, and let long props wrap. */
  .pc-legs td{padding:8px 10px;font-size:12px}
  .legno{width:22px;font-size:9px}
  .pc-odds{font-size:14px}
  .pc-h{gap:6px}
  .est{font-size:7.5px;padding:2px 5px}
  /* Performance's inline 2-col grids are fine at this width; the 4-col
     homer summary is not. */
  .pf-grid{grid-template-columns:repeat(2,1fr)}
  .secth{flex-wrap:wrap;gap:6px}
}
</style>

<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// SimpleOdds board — standalone. Reads simpleodds_log.json from the repo.
// Deliberately shares NOTHING with index.html: own localStorage key, own
// state, own math. Nothing here can affect the MKB numbers.
// ═══════════════════════════════════════════════════════════════════════════
const LS='ccso1';
const GH_BASE='https://raw.githubusercontent.com/dohandley/cccenter/main';
const SRC=`${GH_BASE}/simpleodds_log.json`;

let S={theme:'light',v:'today',tier:'all',hrFilter:'all',hrSort:'edge',q:'',
       unitSize:'',dollarMode:false,data:null};

function ld(){try{const d=JSON.parse(localStorage.getItem(LS));if(d)S={...S,...d}}catch(e){}}
function sv(){
  const {data,...rest}=S;
  try{localStorage.setItem(LS,JSON.stringify({...rest,data}))}catch(e){
    // Payload can exceed the quota once history builds; keep prefs, drop data.
    try{localStorage.setItem(LS,JSON.stringify(rest))}catch(e2){}
  }
}

// ── formatting ─────────────────────────────────────────────────────────────
const fO=v=>(v===null||v===undefined||v==='')?'—':(v>0?`+${v}`:`${v}`);
const fD=(d,s)=>{const t=new Date(d+'T12:00:00');return s?t.toLocaleDateString('en-US',{month:'short',day:'numeric'}):t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'—':`${v>0?'+':''}${Number(v).toFixed(1)}%`;

function fmtU(v,withSign=true){
  const n=Number(v)||0,sz=parseFloat(S.unitSize);
  if(S.dollarMode&&sz>0){
    const d=n*sz,sign=d>=0?'+':'-',abs=Math.abs(d);
    return `${withSign?sign:''}$${abs>=100?abs.toFixed(0):abs.toFixed(2)}`;
  }
  return `${withSign&&n>=0?'+':''}${n.toFixed(2)}u`;
}
window.toggleUnitMode=()=>{const sz=parseFloat(S.unitSize);if(!(sz>0)){toast('Enter a unit size first');return}S.dollarMode=!S.dollarMode;sv();render()};
window.setUnitSize=v=>{S.unitSize=v;sv()};
window.commitUnitSize=()=>{if(!(parseFloat(S.unitSize)>0))S.dollarMode=false;sv();render()};

// American odds -> profit on a 1u stake.
const prof=o=>{const n=Number(o);if(!n)return 0;return n>0?n/100:100/Math.abs(n)};

let tT;function toast(m){clearTimeout(tT);document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);tT=setTimeout(()=>e.remove(),3e3)}

// ── tier helpers ───────────────────────────────────────────────────────────
const TIERS=[['PARLAY','Parlays','tp-parlay'],['SGP','SGP','tp-sgp'],['SGP+','SGP+','tp-sgpplus']];
const tierCls=t=>t==='PARLAY'?'tp-parlay':t==='SGP'?'tp-sgp':t==='SGP+'?'tp-sgpplus':'tp-hr';
const groupKey=t=>t==='PARLAY'?'parlays':t==='SGP'?'sgp':'sgp_plus';

// ── stats ──────────────────────────────────────────────────────────────────
// Recomputed client-side rather than trusting summary{} in the file, so the
// page stays correct if the publisher is ever a version behind.
function tierStats(rows){
  const o={n:0,w:0,l:0,void:0,units:0,est:false};
  rows.forEach(r=>{
    if(r.est)o.est=true;
    if(r.verdict==='WIN'){o.n++;o.w++;o.units+=prof(r.combined_odds)}
    else if(r.verdict==='LOSS'){o.n++;o.l++;o.units-=1}
    else o.void++;
  });
  o.roi=o.n?o.units/o.n*100:0;
  o.hit=o.n?o.w/o.n*100:0;
  return o;
}
function hrStats(rows){
  const o={n:0,w:0,units:0,void:0};
  rows.forEach(r=>{
    if(r.result==='WIN'){o.n++;o.w++;o.units+=prof(r.odds)}
    else if(r.result==='LOSS'){o.n++;o.units-=1}
    else o.void++;
  });
  o.roi=o.n?o.units/o.n*100:0;
  o.hit=o.n?o.w/o.n*100:0;
  return o;
}
const hist=()=>(S.data&&S.data.history)||[];
const hrHist=()=>(S.data&&S.data.hr_history)||[];
const legsFor=(d,t,r)=>((S.data&&S.data.legs)||[]).filter(l=>l.date===d&&l.tier===t&&l.rank===r);

// ═══ TODAY ═════════════════════════════════════════════════════════════════
function parlayCard(p,idx){
  const est=p.odds_are_estimate;
  const id=`${p.tier}-${p.rank}`;
  const legs=(p.legs||[]).map((l,i)=>`<tr>
      <td class="legno">${p.rank}.${i+1}</td>
      <td><div class="pn">${esc(l.player)}</div><div class="pg">${esc(l.game)} · ${esc(l.game_time||'')}</div></td>
      <td><span class="pp pp-o">${esc(l.prop)}</span></td>
      <td class="od">${fO(l.odds_at_book!=null?l.odds_at_book:l.best_odds)}</td>
      <td class="hs"><span class="ev evh">${pct(l.ev_pct)}</span></td>
      <td class="hm">${l.grade?`<span class="gr g${String(l.grade).toLowerCase()}">${esc(l.grade)}</span>`:''}</td>
      <td class="hm pg">${l.coverage!=null?l.coverage+' bks':''}</td>
    </tr>`).join('');
  return `<div class="pc">
    <div class="pc-h" onclick="tgl('${id}')">
      <span class="rk rk-${p.rank<=3?'1':'2'}">${p.rank}</span>
      <span class="pc-odds">${fO(p.combined_odds)}</span>
      <span class="pc-book">${esc(p.book)}</span>
      ${est?'<span class="est">EST. PRICE</span>':''}
      <span class="pc-meta">
        <span>avg EV ${pct(p.avg_ev_pct)}</span>
        <span>${(p.legs||[]).length} legs</span>
      </span>
      <span class="pc-games">${esc((p.games||[]).join('  /  '))}</span>
    </div>
    <table class="pc-legs" id="lg-${id}">${legs}</table>
  </div>`;
}
window.tgl=id=>{const e=document.getElementById('lg-'+id);if(e)e.style.display=e.style.display==='none'?'table':'none'};

function pgToday(){
  const t=S.data&&S.data.today;
  if(!t)return emptyState('No card loaded','Run publish_simpleodds.py, then hit Refresh.');
  const show=TIERS.filter(([k])=>S.tier==='all'||S.tier===k);
  let html='';
  if(t.odds_last_update)html+=`<div class="hint">Odds last updated ${esc(t.odds_last_update)} · card generated ${esc((t.scraped_at||'').replace('T',' ').slice(0,16))}</div>`;
  show.forEach(([key,label])=>{
    const rows=t[groupKey(key)]||[];
    if(!rows.length)return;
    const est=rows.some(r=>r.odds_are_estimate);
    html+=`<div class="secth"><span class="tierpill ${tierCls(key)}">${label}</span>
      <span class="sub">${rows.length} built</span>
      ${est?'<span class="est">COMBINED ODDS ARE ESTIMATES</span>':''}</div>`;
    if(est)html+=`<div class="callout">These are raw multiplied prices. Same-game legs correlate, and the book applies a discount that isn't in the per-leg data — the real ticket will pay less than shown. Priced tiers are marked separately in Performance.</div>`;
    html+=rows.map(parlayCard).join('');
  });
  return html||emptyState('Nothing built today','No parlays cleared the filters.');
}

// ═══ HOMERS ════════════════════════════════════════════════════════════════
function pgHomers(){
  const t=S.data&&S.data.today;
  let plays=(t&&t.hr_plays)||[];
  if(S.hrFilter==='bet')plays=plays.filter(p=>p.is_bet);
  else if(S.hrFilter==='pos')plays=plays.filter(p=>Number(p.edge_pct)>0);
  if(S.q){const q=S.q.toLowerCase();plays=plays.filter(p=>(p.player+' '+p.team+' '+p.game+' '+p.pitcher).toLowerCase().includes(q))}
  plays=[...plays].sort((a,b)=>S.hrSort==='edge'?Number(b.edge_pct)-Number(a.edge_pct)
    :S.hrSort==='score'?Number(b.score)-Number(a.score)
    :Number(a.odds)-Number(b.odds));

  const st=hrStats(hrHist());
  const bar=`<div class="fbar">
    <span class="fl">Show</span>
    ${[['all','All'],['pos','+Edge only'],['bet','Model bets']].map(([k,l])=>`<button class="fb ${S.hrFilter===k?'on':''}" onclick="setHrF('${k}')">${l}</button>`).join('')}
    <span class="fdot">·</span><span class="fl">Sort</span>
    ${[['edge','Edge'],['score','Score'],['odds','Odds']].map(([k,l])=>`<button class="fb ${S.hrSort===k?'on':''}" onclick="setHrS('${k}')">${l}</button>`).join('')}
    <span class="fdot">·</span>
    <input class="sinp" placeholder="Search player…" value="${esc(S.q)}" oninput="setQ(this.value)">
  </div>`;

  const warn=st.n>=50&&st.roi<0?`<div class="callout"><strong>Track record check:</strong> ${st.n} graded plays, ${st.hit.toFixed(1)}% hit rate, ${fmtU(st.units)} (${pct(st.roi)} ROI). This list has not shown an edge yet. Treat it as a screen to research, not a bet slip.</div>`:'';

  if(!plays.length)return bar+warn+emptyState('No homer plays','Nothing matches those filters.');

  const rows=plays.map(p=>`<tr>
    <td><div class="pn">${esc(p.player)}</div><div class="pg">${esc(p.team)} · ${esc(p.game)}</div></td>
    <td class="hm pg">${esc(p.pitcher)}${p.pitcher_hand?' ('+esc(p.pitcher_hand)+')':''}</td>
    <td class="hs"><span class="ev evc">${p.score!=null?Number(p.score).toFixed(1):'—'}</span></td>
    <td class="od">${fO(p.odds)}</td>
    <td><span class="pc-book">${esc(p.book)}</span></td>
    <td class="hs pg">${p.true_prob!=null?Number(p.true_prob).toFixed(1)+'%':'—'}</td>
    <td class="hs pg">${p.implied_prob!=null?Number(p.implied_prob).toFixed(1)+'%':'—'}</td>
    <td><span class="ev ${Number(p.edge_pct)>0?'evh':'evc'}">${pct(p.edge_pct)}</span></td>
    <td class="hm">${p.is_bet?'<span class="res res-w">BET</span>':''}</td>
  </tr>`).join('');

  return bar+warn+`<div class="lb">
    <div class="lb-h"><div class="lb-t">💣 Homer List</div><div class="lb-s">${plays.length} plays</div></div>
    <div class="tw"><table>
      <thead><tr><th>Player</th><th class="hm">Pitcher</th><th class="hs">Score</th><th>Odds</th><th>Book</th><th class="hs">Model</th><th class="hs">Implied</th><th>Edge</th><th class="hm"></th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}
window.setHrF=k=>{S.hrFilter=k;sv();render()};
window.setHrS=k=>{S.hrSort=k;sv();render()};
window.setQ=v=>{S.q=v;sv();render()};

// ═══ HISTORY ═══════════════════════════════════════════════════════════════
function pgHistory(){
  let rows=hist();
  if(S.tier!=='all')rows=rows.filter(r=>r.tier===S.tier);
  if(!rows.length)return emptyState('No graded history','Run grade_parlays.py, then publish.');

  const byDate={};
  rows.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r)});
  const dates=Object.keys(byDate).sort().reverse();

  const body=dates.map(d=>{
    const dr=byDate[d],ds=tierStats(dr);
    const detail=dr.map(r=>{
      const rc=r.verdict==='WIN'?'res-w':r.verdict==='LOSS'?'res-l':'res-v';
      const lg=legsFor(r.date,r.tier,r.rank);
      const legTxt=lg.length?lg.map(l=>`<span style="white-space:nowrap">${esc(l.player)} ${esc(l.prop)} <span class="res ${l.result==='WIN'?'res-w':l.result==='LOSS'?'res-l':'res-p'}">${esc(l.actual!==''&&l.actual!=null?l.actual:l.result[0])}</span></span>`).join(' &nbsp;·&nbsp; '):`<span class="pg">${esc(r.games)}</span>`;
      return `<tr class="detail-row" data-day="${d}" style="display:none">
        <td><span class="tierpill ${tierCls(r.tier)}">${esc(r.tier)}</span> <span class="pg">#${r.rank}</span></td>
        <td class="od">${fO(r.combined_odds)} ${r.est?'<span class="est">EST</span>':''}</td>
        <td><span class="pc-book">${esc(r.book)}</span></td>
        <td class="hs pg">${r.n_legs} legs</td>
        <td><span class="res ${rc}">${esc(r.verdict)}</span></td>
        <td colspan="2" style="font-size:11px">${legTxt}</td>
      </tr>`;
    }).join('');
    return `<tr class="day-row" onclick="toggleDay('${d}')">
        <td><span id="arrow-${d}">▶</span> <strong>${fD(d)}</strong></td>
        <td class="pg">${dr.length} tickets</td>
        <td class="hs pg">${ds.w}-${ds.l}${ds.void?'-'+ds.void:''}</td>
        <td class="hs pg">${ds.hit.toFixed(0)}%</td>
        <td class="od" style="color:var(--${ds.units>=0?'green':'red'}-text)">${fmtU(ds.units)}</td>
        <td class="hm pg">${pct(ds.roi)}</td>
        <td></td>
      </tr>${detail}`;
  }).join('');

  return `<div class="tw"><table>
    <thead><tr><th>Date</th><th>Tickets</th><th class="hs">W-L</th><th class="hs">Hit</th><th>Units</th><th class="hm">ROI</th><th></th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}
window.toggleDay=d=>{
  const rows=document.querySelectorAll(`.detail-row[data-day="${d}"]`);
  const arrow=document.getElementById('arrow-'+d);
  const showing=rows[0]&&rows[0].style.display!=='none';
  rows.forEach(r=>r.style.display=showing?'none':'table-row');
  if(arrow)arrow.textContent=showing?'▶':'▼';
};

// ═══ PERFORMANCE ═══════════════════════════════════════════════════════════
function pgPerf(){
  const all=hist();
  if(!all.length)return emptyState('Nothing graded yet','Performance fills in once grade_parlays.py has run.');

  // Tier table — priced vs estimated kept visually distinct.
  const tierRows=TIERS.map(([k,label])=>{
    const s=tierStats(all.filter(r=>r.tier===k));
    if(!s.n&&!s.void)return '';
    return `<tr>
      <td><span class="tierpill ${tierCls(k)}">${label}</span> ${s.est?'<span class="est">EST</span>':''}</td>
      <td class="pg">${s.n}</td>
      <td class="pg">${s.w}-${s.l}${s.void?'-'+s.void:''}</td>
      <td class="pg">${s.hit.toFixed(1)}%</td>
      <td class="od" style="color:var(--${s.units>=0?'green':'red'}-text)">${fmtU(s.units)}</td>
      <td class="od" style="color:var(--${s.roi>=0?'green':'red'}-text)">${pct(s.roi)}</td>
    </tr>`;
  }).join('');

  const priced=tierStats(all.filter(r=>!r.est));
  const estd=tierStats(all.filter(r=>r.est));

  // Daily P/L across whichever tiers are selected.
  const sel=S.tier==='all'?all:all.filter(r=>r.tier===S.tier);
  const byDay={};
  sel.forEach(r=>{
    if(r.verdict==='WIN')byDay[r.date]=(byDay[r.date]||0)+prof(r.combined_odds);
    else if(r.verdict==='LOSS')byDay[r.date]=(byDay[r.date]||0)-1;
  });
  const days=Object.keys(byDay).sort().slice(-14);
  const mx=Math.max(...days.map(d=>Math.abs(byDay[d])),1);
  const bars=days.map(d=>{
    const v=byDay[d],h=Math.abs(v)/mx*82;
    return `<div class="bar-c"><div class="bar-v">${v>=0?'+':''}${v.toFixed(0)}</div>
      <div class="bar" style="height:${h}px;background:var(--${v>=0?'green':'red'})"></div>
      <div class="bar-l">${fD(d,1)}</div></div>`;
  }).join('');

  // Odds buckets — where does the money actually come from?
  const buckets=[[0,500,'< +500'],[500,1000,'+500–1000'],[1000,2500,'+1000–2500'],[2500,1e9,'+2500 and up']];
  const bRows=buckets.map(([lo,hi,label])=>{
    const s=tierStats(sel.filter(r=>Math.abs(r.combined_odds)>=lo&&Math.abs(r.combined_odds)<hi));
    if(!s.n)return '';
    return `<tr><td class="pg">${label}</td><td class="pg">${s.n}</td><td class="pg">${s.hit.toFixed(1)}%</td>
      <td class="od" style="color:var(--${s.units>=0?'green':'red'}-text)">${fmtU(s.units)}</td>
      <td class="od" style="color:var(--${s.roi>=0?'green':'red'}-text)">${pct(s.roi)}</td></tr>`;
  }).join('');

  // Concentration: how much of the profit is one lucky ticket?
  const wins=sel.filter(r=>r.verdict==='WIN').map(r=>prof(r.combined_odds)).sort((a,b)=>b-a);
  const totalWon=wins.reduce((a,b)=>a+b,0);
  const top1=totalWon?wins[0]/totalWon*100:0;
  const top3=totalWon?wins.slice(0,3).reduce((a,b)=>a+b,0)/totalWon*100:0;

  const hs=hrStats(hrHist());

  return `<div class="cg">
    <div class="ch"><div class="ct">By Tier</div>
      <div class="tw"><table><thead><tr><th>Tier</th><th>N</th><th>W-L</th><th>Hit</th><th>Units</th><th>ROI</th></tr></thead><tbody>${tierRows}</tbody></table></div>
    </div>
    <div class="ch"><div class="ct">Priced vs Estimated</div>
      <div class="pf-grid" style="grid-template-columns:1fr 1fr">
        <div class="pf-stat"><div class="pf-stat-l">Real prices</div><div class="pf-stat-v" style="color:var(--${priced.roi>=0?'green':'red'}-text)">${pct(priced.roi)}</div><div class="st-s">${priced.n} tickets · ${fmtU(priced.units)}</div></div>
        <div class="pf-stat"><div class="pf-stat-l">Estimated</div><div class="pf-stat-v" style="color:var(--text-3)">${pct(estd.roi)}</div><div class="st-s">${estd.n} tickets · not real</div></div>
      </div>
      <div class="hint" style="margin-top:12px;margin-bottom:0">Only the left number is a track record. SGP prices are raw multiplications; the book's correlation discount isn't in the leg data, so estimated ROI reads high.</div>
    </div>
  </div>

  <div class="ch" style="margin-bottom:16px"><div class="ct">Daily P/L · last ${days.length} graded days${S.tier!=='all'?' · '+S.tier:''}</div>
    <div class="bar-chart">${bars}</div></div>

  <div class="cg">
    <div class="ch"><div class="ct">By Price Bucket${S.tier!=='all'?' · '+S.tier:''}</div>
      <div class="tw"><table><thead><tr><th>Odds</th><th>N</th><th>Hit</th><th>Units</th><th>ROI</th></tr></thead><tbody>${bRows||'<tr><td colspan="5" class="pg">No data</td></tr>'}</tbody></table></div>
    </div>
    <div class="ch"><div class="ct">Variance Check</div>
      <div class="pf-grid" style="grid-template-columns:1fr 1fr">
        <div class="pf-stat"><div class="pf-stat-l">Top win</div><div class="pf-stat-v">${top1.toFixed(0)}%</div><div class="st-s">of all winnings</div></div>
        <div class="pf-stat"><div class="pf-stat-l">Top 3 wins</div><div class="pf-stat-v">${top3.toFixed(0)}%</div><div class="st-s">of all winnings</div></div>
      </div>
      <div class="hint" style="margin-top:12px;margin-bottom:0">High concentration means the record rests on a few tickets. At small n, that's variance, not proven edge.</div>
    </div>
  </div>

  <div class="ch"><div class="ct">💣 Homer List</div>
    <div class="pf-grid">
      <div class="pf-stat"><div class="pf-stat-l">Graded</div><div class="pf-stat-v">${hs.n}</div></div>
      <div class="pf-stat"><div class="pf-stat-l">Hit rate</div><div class="pf-stat-v">${hs.hit.toFixed(1)}%</div></div>
      <div class="pf-stat"><div class="pf-stat-l">Units</div><div class="pf-stat-v" style="color:var(--${hs.units>=0?'green':'red'}-text)">${fmtU(hs.units)}</div></div>
      <div class="pf-stat"><div class="pf-stat-l">ROI</div><div class="pf-stat-v" style="color:var(--${hs.roi>=0?'green':'red'}-text)">${pct(hs.roi)}</div></div>
    </div>
    <div class="hint" style="margin-top:12px;margin-bottom:0">Grades every play on the board, not a selected bet list — the model flags only a fraction as actual bets.</div>
  </div>`;
}

function emptyState(t,s){return `<div class="empty"><div class="empty-e">⚾</div><div style="font-weight:700;color:var(--text-2);margin-bottom:4px">${esc(t)}</div><div>${esc(s)}</div></div>`}

  </div></div>`;

  const page=S.v==='today'?pgToday():S.v==='homers'?pgHomers():S.v==='history'?pgHistory():pgPerf();
  a.innerHTML=h+nav+`<div class="body">${page}</div>`;
}
window.setV=v=>{S.v=v;sv();render()};
window.setTier=k=>{S.tier=k;sv();render()};
window.toggleTheme=()=>{S.theme=S.theme==='dark'?'light':'dark';sv();render()};

// ═══ LIVE FETCH ════════════════════════════════════════════════════════════
window.refreshLive=async(opts={})=>{
  try{
    const r=await fetch(SRC+`?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d||!d.source)throw new Error('unrecognized payload');
    S.data=d;sv();render();
    if(!opts.silent)toast('SimpleOdds data refreshed');
    return true;
  }catch(e){
    console.warn('SimpleOdds fetch failed',e);
    if(!opts.silent)toast('Fetch failed — showing saved data');
    render();
    return false;
  }
};

ld();
render();
refreshLive({silent:true});
</script>
